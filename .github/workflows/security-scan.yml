name: Security scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      - name: Install tools
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin:$HOME/go/bin"
          go install github.com/securego/gosec/v2/cmd/gosec@v2.7.0 || true
          go install honnef.co/go/tools/cmd/staticcheck@2022.1.3 || true
          go install github.com/zricethezav/gitleaks/v8@v8.18.0 || true
      - name: Run security scan
        run: bash scripts/security-scan.sh
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports
